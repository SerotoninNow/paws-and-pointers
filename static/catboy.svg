  </g>
  <path d="M68 80 L60 44 L96 64 Z" fill="#ff9fc6"/>
  <path d="M172 80 L180 44 L144 64 Z" fill="#ff9fc6"/>

  <!-- hair (back) and face -->
  <ellipse cx="120" cy="116" rx="74" ry="64" fill="#4a3d7a"/>
  <ellipse cx="120" cy="134" rx="60" ry="52" fill="#ffe9dc"/>

  <!-- bangs -->
  <path d="M56 126 C52 72 90 52 120 52 C150 52 188 72 184 126 C176 108 168 98 158 92 L150 118 L138 90 L124 120 L110 90 L96 118 L86 92 C74 98 64 108 56 126 Z" fill="#4a3d7a"/>
  <path d="M116 56 C108 36 124 26 136 32 C127 36 124 46 127 56 Z" fill="#4a3d7a"/>
  <path d="M78 84 C88 72 100 68 110 68" fill="none" stroke="#7a6bb8" stroke-width="4" stroke-linecap="round"/>

  <!-- eyes -->
  <g>
    <ellipse cx="96" cy="140" rx="12" ry="15" fill="#2b2350"/>
    <ellipse cx="96" cy="145" rx="8" ry="9" fill="#3fd0c9"/>
    <circle cx="100" cy="133" r="4.5" fill="#fff"/>
    <circle cx="91" cy="147" r="2" fill="#fff"/>
    <ellipse cx="144" cy="140" rx="12" ry="15" fill="#2b2350"/>
    <ellipse cx="144" cy="145" rx="8" ry="9" fill="#3fd0c9"/>
    <circle cx="148" cy="133" r="4.5" fill="#fff"/>
    <circle cx="139" cy="147" r="2" fill="#fff"/>
  </g>

  <!-- blush, mouth, fang -->
  <ellipse cx="76" cy="160" rx="10" ry="5" fill="#ff9fc6" opacity=".65"/>
  <ellipse cx="164" cy="160" rx="10" ry="5" fill="#ff9fc6" opacity=".65"/>
  <path d="M110 163 Q115 170 120 163 Q125 170 130 163" fill="none" stroke="#2b2350" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M123 166 L125.500 172 L128 166 Z" fill="#fff" stroke="#2b2350" stroke-width="1.500" stroke-linejoin="round"/>
