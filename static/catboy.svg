<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="Catboy mascot in a purple hoodie">
  <!-- tail -->
  <path d="M170 236 C218 236 232 192 208 172 C196 162 184 176 196 186" fill="none" stroke="#4a3d7a" stroke-width="15" stroke-linecap="round"/>
  <path d="M203 169 C196 164 187 174 196 186" fill="none" stroke="#f6f1ff" stroke-width="15" stroke-linecap="round"/>

  <!-- hoodie -->
  <path d="M50 260 C50 214 82 194 120 194 C158 194 190 214 190 260 Z" fill="#8b7be8"/>
  <ellipse cx="120" cy="200" rx="54" ry="18" fill="#6f5fd4"/>
  <path d="M108 208 L105 234 M132 208 L135 234" stroke="#f6f1ff" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="252" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" font-weight="700" fill="#f6f1ff">&lt;/&gt;</text>

  <!-- ears -->
  <g stroke="#4a3d7a" stroke-width="8" stroke-linejoin="round" fill="#4a3d7a">
