{% extends "base.html" %}

{% block title %}Log in · {{ site_name }}{% endblock %}

{% block content %}
<div class="card eared auth">
  <h1>Log in</h1>
  <form class="form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      Username
      <input type="text" name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="switch">New here? <a href="{{ url_for('register', next=request.args.get('next')) }}">Create an account</a></p>
</div>
{% endblock %}
